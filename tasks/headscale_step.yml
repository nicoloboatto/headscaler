---
# Called once per step_version by the loop in update_headscale_stack.yml.
- block:
    - name: "Patch image tag in docker-compose.yml → {{ step_version }}"
      ansible.builtin.lineinfile:
        path: "{{ stack_root }}/docker-compose.yml"
        regexp: '^\s+image:\s+headscale/headscale:'
        line: "    image: headscale/headscale:{{ step_version }}"

    - name: "Pull headscale image {{ step_version }}"
      ansible.builtin.command:
        cmd: docker compose pull headscale
        chdir: "{{ stack_root }}"
      changed_when: true

    - name: "Restart headscale at {{ step_version }}"
      ansible.builtin.command:
        # --no-deps:        do not restart headplane or traefik
        # --force-recreate: always replace the container even if compose
        #                   did not detect an image change via its own hash
        cmd: docker compose up -d --no-deps --force-recreate headscale
        chdir: "{{ stack_root }}"
      changed_when: true

    - name: Get headscale container IP for health check
      ansible.builtin.shell: "{% raw %}docker inspect headscale --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}'{% endraw %}"
      register: headscale_ip
      changed_when: false

    - name: "Wait for headscale to become healthy at {{ step_version }}"
      ansible.builtin.uri:
        url: "http://{{ headscale_ip.stdout | trim }}:{{ hs_port }}/health"
        status_code: 200
      register: hs_health
      until: hs_health.status == 200
      retries: 18
      delay: 10

    - name: "Verify headscale container is still running at {{ step_version }}"
      ansible.builtin.shell: "docker inspect headscale --format '{{ '{{' }} .State.Status {{ '}}' }}'"
      register: container_state
      changed_when: false
      failed_when: "'running' not in container_state.stdout"

  rescue:
    - name: "UPGRADE FAILED at {{ step_version }} — halting"
      ansible.builtin.fail:
        msg: |
          Headscale upgrade to {{ step_version }} failed.
          The SQLite database may have been partially migrated.
          DO NOT downgrade the container image without consulting the
          headscale migration docs — schema migrations are one-way.
          Investigate with: docker compose -f {{ stack_root }}/docker-compose.yml logs headscale
